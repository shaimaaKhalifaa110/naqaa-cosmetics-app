<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqaa Cosmetics E-Commerce</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <script src="style.css"></script>
</head>

<body class="bg-bgLight font-sans text-gray-800">
    <!-- شريط التنقل (الناف بار) -->
    <nav
        class="bg-bgWhite shadow-md p-4 flex justify-between items-center border-b-4 border-brandPinkDark sticky top-0 z-10">
        <h1 class="text-3xl font-extrabold text-brandRed">💄 نقاء كوزمتكس</h1>

        <div class="flex items-center gap-4">
            <!-- شريط البحث -->
            <input type="text" id="search-input" placeholder="ابحثي عن مستحضر..."
                class="border-2 border-brandPinkDark rounded-full px-4 py-2 focus:outline-none focus:border-brandRed transition-colors w-64">

            <!-- السلة -->
           <div id="cart-open-btn" class="bg-brandPink text-brandRed font-bold px-6 py-2 rounded-full shadow-sm cursor-pointer hover:bg-brandPinkDark hover:text-white transition">
    السلة: <span id="cart-count">0</span>
</div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto p-8">
        <h2 class="text-3xl text-center text-brandPinkDark mb-10 font-bold">تألقي بأحدث منتجات التجميل ✨</h2>

        <!-- شبكة المنتجات (Grid) -->
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <p class="text-center col-span-full text-brandRed text-xl font-bold animate-pulse">جاري تحميل مستحضرات
                التجميل... ⏳</p>
        </div>


        <!-- نافذة السلة الجانبية (مخفية افتراضياً بفضل كلاس hidden) -->
<div id="cart-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col relative">
        
        <!-- رأس السلة وزر الإغلاق -->
        <div class="flex justify-between items-center border-b-2 border-brandPink pb-4 mb-4">
            <h2 class="text-2xl font-bold text-brandRed">سلة المشتريات 🛒</h2>
            <button id="cart-close-btn" class="text-gray-500 hover:text-red-600 text-2xl font-bold">✕</button>
        </div>

        <!-- المنطقة التي سترسم فيها الجافاسكريبت المنتجات -->
        <div id="cart-items-container" class="flex-1 overflow-y-auto pr-2">
            <p class="text-center text-gray-500 mt-10">السلة فارغة حالياً 🥲</p>
        </div>

        <!-- قسم الإجمالي وإتمام الدفع -->
        <div class="border-t-2 border-brandPink pt-4 mt-4">
            <div class="flex justify-between items-center font-bold text-xl mb-4">
                <span>الإجمالي:</span>
                <span class="text-brandRed"><span id="cart-total">0</span> $</span>
            </div>
            <button class="w-full bg-brandRed text-white font-bold py-3 rounded-xl hover:bg-red-700 transition">
                إتمام الطلب 🚀
            </button>
        </div>
    </div>
</div>
    </main>


    <script src="app.js"></script>
</body>

</html>
